# Kitty 0.48+ is required for vertical tabs.
tab_bar_edge left
tab_bar_style separator

# The custom draw_title() reserves: attention, state, spacer, manual title.
tab_title_template "{custom}{bell_symbol:.0s}{activity_symbol:.0s}"
active_tab_title_template "{custom}{bell_symbol:.0s}{activity_symbol:.0s}"
bell_on_tab "·"
tab_activity_symbol ""
watcher agent_status_watcher.py

# The socket is required only for the five-minute all-pane collector.
# Kitty adds -{kitty_pid} to a filesystem Unix address from kitty.conf.
allow_remote_control socket-only
listen_on unix:${HOME}/.local/state/kitty-agent-status/kitty-rc

# Optional custom-Kitty patch settings. Stock Kitty ignores neither unknown
# options, so enable these only after applying and building the patch.
# vertical_tab_bar_resize yes
# vertical_tab_bar_width 32
